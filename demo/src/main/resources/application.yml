spring:
  jpa:
    open-in-view: false
    generate-ddl: 'false'
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: 'true'
    show-sql: 'false'
mybatis:
  mapper-locations: classpath:mybatis/mapper/**/**.xml
  configuration:
    map-underscore-to-camel-case: 'true'
    call-setters-on-nulls: true
